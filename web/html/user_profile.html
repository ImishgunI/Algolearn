<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/profile.css"/>
</head>

<body>

<div class="profile-wrapper">

    <h2 class="title">Личный кабинет</h2>

    <!-- БЛОК ДАННЫХ ПОЛЬЗОВАТЕЛЯ -->
    <section class="user-info box">
        <h3>Ваши данные</h3>

        <label>Имя:</label>
        <input id="usernameInput" type="text">

        <label>Email:</label>
        <input id="emailInput" type="text" disabled>

        <button class="save-btn" onclick="saveProfile()">Сохранить</button>
    </section>


    <!-- БЛОК СТАТИСТИКИ -->
    <section class="stats box">
        <h3>Статистика</h3>

        <div class="stat-item">Пройдено уроков: <span id="progressCompleted">0</span></div>
        <div class="stat-item">Всего уроков: <span id="progressTotal">0</span></div>
        <div class="stat-item">Избранных уроков: <span id="favoritesCount">0</span></div>
        <div class="stat-item">Просмотрено тем: <span id="topicsViewed">0</span></div>
    </section>


    <!-- НАВИГАЦИЯ -->
    <section class="links box">
        <h3>Навигация</h3>
        <a class="link-btn" href="index.html">Все курсы</a>
        <a class="link-btn" href="favorites.html">⭐ Избранное</a>
        <button class="logout-btn" onclick="logout()">Выйти</button>
    </section>

</div>

<script src="profile.js"></script>

</body>
</html>
