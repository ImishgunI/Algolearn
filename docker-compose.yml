services:
  postgres:
    image: postgres:18
    restart: always
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 50s
      retries: 5
      start_period: 10s
    networks:
      - app-networks

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-networks

  app:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: algolearn
    build:
      context: ./
      dockerfile: Dockerfile.backend
    environment:
      REDIS_URL: ${REDIS_URL}
      POSTGRES_URL: ${POSTGRES_URL}
    env_file:
      - .env
    networks:
      - app-networks

volumes:
  redis_data:
    driver: local
  pgdata:

networks:
  app-networks: