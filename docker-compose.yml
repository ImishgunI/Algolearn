services:
  db:
    image: postgres:15-alpine
    container_name: algolearn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algolearn
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: alpine:latest
    depends_on:
      db:
        condition: service_healthy
    build:
      dockerfile: Dockerfile
      context: .
    container_name: algolearn_backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@db:5432/algolearn?sslmode=disable
      PORT: 8080

  frontend:
    image: nginx:latest
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    build:
      dockerfile: web/Dockerfile
      context: .
    container_name: algolearn_frontend
    ports:
      - "3000:80"
    restart: always

volumes:
  pg_data:
